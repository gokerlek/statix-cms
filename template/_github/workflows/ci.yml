name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          GITHUB_OWNER: placeholder
          GITHUB_REPO: placeholder
          TURSO_DATABASE_URL: "file:ci.db"
          TURSO_AUTH_TOKEN: "ci-placeholder"
          BETTER_AUTH_SECRET: "ci-placeholder-secret-32-chars-long-xx"
          BETTER_AUTH_URL: "http://localhost:3000"
          RESEND_API_KEY: "re_ci_placeholder"
          RESEND_FROM_EMAIL: "ci@example.com"
          R2_ACCOUNT_ID: "placeholder"
          R2_ACCESS_KEY_ID: "placeholder"
          R2_SECRET_ACCESS_KEY: "placeholder"
          R2_BUCKET_NAME: "placeholder"
          NEXT_PUBLIC_MEDIA_BASE_URL: "https://pub-placeholder.r2.dev"
          INITIAL_ADMIN_EMAIL: "admin@example.com"
      - name: Security audit (high + critical)
        run: npm audit --production --audit-level=high || echo "::warning::Audit found issues (non-blocking)"
